[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "openssl", reason = "strict profile uses RustCrypto" },
    { crate = "openssl-sys", reason = "strict profile forbids native OpenSSL" },
    { crate = "libsqlite3-sys", reason = "original Rust storage requirement" },
    { crate = "rocksdb", reason = "original Rust storage requirement" },
    { crate = "librocksdb-sys", reason = "original Rust storage requirement" },
    { crate = "geos", reason = "strict profile requires Rust spatial algorithms" },
    { crate = "geos-sys", reason = "strict profile forbids native GIS engines" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = []
