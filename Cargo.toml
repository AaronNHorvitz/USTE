[workspace]
members = ["crates/uste-types"]
exclude = [
    "experiments/content-fixtures",
    "experiments/dependency-audit",
    "experiments/fixture-generator",
    "fuzz",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AaronNHorvitz/USTE"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = "warn"
