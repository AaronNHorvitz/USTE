[package]
name = "uste-dependency-audit"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
csv = { version = "=1.4.0", default-features = true }
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
hkdf = { version = "=0.13.0", default-features = false }
hound = { version = "=3.5.1", default-features = false }
html5ever = { version = "=0.40.1", default-features = false }
lopdf = { version = "=0.45.0", default-features = false }
png = { version = "=0.18.1", default-features = false }
quick-xml = { version = "=0.42.0", default-features = false }
serde_json = { version = "=1.0.151", default-features = true }
sha2 = { version = "=0.11.0", default-features = false }
tar = { version = "=0.4.46", default-features = false }
y4m = { version = "=0.8.0", default-features = false }
zip = { version = "=8.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
