[package]
name = "uste-t20-bench"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
uste-crypto = { path = "../../crates/uste-crypto" }
uste-graph = { path = "../../crates/uste-graph" }
uste-policy = { path = "../../crates/uste-policy" }
uste-storage = { path = "../../crates/uste-storage" }
uste-txn = { path = "../../crates/uste-txn" }
uste-types = { path = "../../crates/uste-types" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
