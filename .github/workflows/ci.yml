name: ci

on:
  push:
    branches: [main, codex/uste-implementation]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch locked dependency graphs
        run: |
          cargo fetch --locked
          for manifest in \
            experiments/dependency-audit/Cargo.toml \
            experiments/fixture-generator/Cargo.toml \
            experiments/content-fixtures/Cargo.toml
          do
            cargo fetch --manifest-path "$manifest" --locked
          done
      - name: Run workspace and R0 checks
        run: bash scripts/check.sh
      - name: Install pinned dependency policy tool
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licenses and sources
        run: bash scripts/check_supply_chain.sh
