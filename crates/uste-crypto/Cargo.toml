[package]
name = "uste-crypto"
description = "Authenticated-encryption, key-derivation, entropy, and key-adapter boundary for USTE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "getrandom", "password-hash", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
hkdf = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
uste-types = { path = "../uste-types", version = "=0.1.0" }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
