[package]
name = "uste-storage"
description = "Capability-oriented encrypted journal, recovery and storage adapters for USTE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
sha2 = { version = "=0.11.0", default-features = false }
uste-crypto = { path = "../uste-crypto", version = "=0.1.0" }
uste-types = { path = "../uste-types", version = "=0.1.0" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }

[lints]
workspace = true
